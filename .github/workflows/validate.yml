name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/typescript/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  lambda-powertools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/lambda-powertools/examples/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/lambda-powertools/examples/typescript/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  lambda-powertools-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/lambda-powertools/examples/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills/lambda-powertools/examples/python/requirements-lock.txt
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q

  policy-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: examples/python/requirements.txt
      - run: pip install -r examples/python/requirements.txt pytest pyyaml
      - run: python -m pytest -q examples/python
      - run: python examples/python/ci_gate.py examples/typescript/src examples/python config
      - run: bash -n scripts/install.sh
      - run: python3 scripts/test_install.py
      - name: Parse deployment configurations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import yaml

          for path in Path("config").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for path in Path("config").glob("*.yaml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          PY
